<svg xmlns="http://www.w3.org/2000/svg" width="840" height="428" viewBox="0 0 840 428" role="img" aria-labelledby="title desc">
  <title id="title">One brief, two independent reads</title>
  <desc id="desc">The lead asks the explorer for the tool list and the reviewer for the CI command. Both return a source path and a quote. The lead checks each quote against its file.</desc>
  <rect width="840" height="428" rx="16" fill="#f6f1e6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#262922">
    <path d="M38 48h44" fill="none" stroke="#a14f35" stroke-width="5"/>
    <text x="96" y="53" font-size="16" font-weight="700" letter-spacing="2.5">FIELD NOTES / 01</text>
    <text x="38" y="110" font-family="Georgia, serif" font-size="48">One brief, two reads.</text>
    <path d="M38 139h764" fill="none" stroke="#b8ad99"/>
    <g fill="none" stroke="#78633b" stroke-width="3" stroke-linejoin="round">
      <path d="M162 253h42q19 0 19-20v-22q0-20 19-20h29m-67 62q19 0 19 20v22q0 20 19 20h29"/>
      <path d="M539 191h28q20 0 20 20v22q0 20 20 20h37m-105 62h28q20 0 20-20v-22q0-20 20-20"/>
      <path d="m635 245 10 8-10 8"/>
    </g>
    <rect x="38" y="220" width="124" height="66" rx="7" fill="#282d25"/>
    <text x="100" y="262" text-anchor="middle" font-size="25" fill="#fff8e9">Lead</text>
    <g stroke-width="2">
      <rect x="272" y="155" width="266" height="79" rx="7" fill="#e4edf0" stroke="#63818b"/>
      <rect x="272" y="273" width="266" height="79" rx="7" fill="#e4e9dc" stroke="#718264"/>
    </g>
    <text x="292" y="187" font-size="25" font-weight="700">Explorer</text>
    <text x="292" y="216" font-size="20">Find the allowed tools.</text>
    <text x="292" y="305" font-size="25" font-weight="700">Reviewer</text>
    <text x="292" y="334" font-size="20">Find the CI command.</text>
    <rect x="651" y="215" width="151" height="76" rx="7" fill="#282d25"/>
    <text x="726" y="247" text-anchor="middle" font-size="23" font-weight="700" fill="#fff8e9">Verify</text>
    <text x="726" y="274" text-anchor="middle" font-size="18" fill="#eee3c8">both quotes</text>
    <path d="M38 373h764" fill="none" stroke="#b8ad99"/>
    <text x="38" y="406" font-size="19">Handoff: a source path and an exact quote from each agent.</text>
  </g>
</svg>
