<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" viewBox="0 0 840 392" role="img" aria-labelledby="title desc">
  <title id="title">Can the second agent start now?</title>
  <desc id="desc">Run independent reads in parallel. If the reviewer needs a finished diff, let the builder finish before the review starts.</desc>
