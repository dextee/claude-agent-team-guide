    <text x="38" y="108" font-size="43" font-family="Georgia, serif">Can the second agent start now?</text>
    <g stroke="#717267"><path d="M38 138h764M38 245h764M38 352h764"/></g>
    <text x="38" y="181" font-size="24" font-weight="700" fill="#bcd4d9">Parallel</text>
    <text x="38" y="213" font-size="19">Separate inputs</text>
    <text x="38" y="289" font-size="24" font-weight="700" fill="#efb697">Sequential</text>
